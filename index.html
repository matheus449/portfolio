    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Lora:ital,wght@0,500;0,600;1,500;1,600&display=swap"
      rel="stylesheet"
    />
    <script>
      window.__loadStaticBundle = function () {
        if (window.__VITE_ACTIVE__ || window.__STATIC_BUNDLE_LOADED__) return;
        window.__STATIC_BUNDLE_LOADED__ = true;
        var link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = './assets/app-bundle.css';
        document.head.appendChild(link);
        var script = document.createElement('script');
        script.type = 'module';
        script.src = './assets/app-bundle.js';
        document.body.appendChild(script);
      };
      setTimeout(function () {
        var root = document.getElementById('root');
        if (!window.__VITE_ACTIVE__ && (!root || root.children.length === 0)) {
          window.__loadStaticBundle();
        }
      }, 600);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx" onerror="window.__loadStaticBundle()"></script>
  </body>
</html>
